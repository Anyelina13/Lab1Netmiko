# Inventario de equipos del laboratorio GNS3 (red 10.60.30.0/24).
# Aquí NO van contraseñas: se leen de variables de entorno LAB_PASS_<NOMBRE>
# (ej. mt-lab -> LAB_PASS_MT_LAB) o se piden al ejecutar el script.
#
# rol: lectura   -> solo se consulta el estado
# rol: escritura -> además se permite aplicar el cambio de configuración

# Datos para el cambio de configuración (R6). Todo lo que se crea en el
# MikroTik lleva el número de lista N para no pisar lo de otros estudiantes:
#   bridge lo-ssh-<N> con IP 10.253.0.<N>/32
# Mientras esto no esté lleno, el script solo consulta y no cambia nada.
estudiante:
  numero_lista:     # N (entero, ej. 7)
  nombre:           # va en el comentario de los objetos

equipos:
  - nombre: mt-lab
    host: 10.60.30.202
    device_type: mikrotik_routeros
    usuario: labssh
    rol: escritura

  # Extra multivendor: el Cisco es compartido y solo se consulta
  - nombre: cisco-lab
    host: 10.60.30.203
    device_type: cisco_ios
    usuario: labssh
    rol: lectura
